version: 2

seeds:
  - name: reference_data
    description: "General lookup values used across the project."
    columns:
      - name: key
        tests:
          - not_null
          - unique
      - name: value
        tests:
          - not_null

  - name: order_status_mapping
    description: "Mapping table for raw order statuses to standardized values."
    columns:
      - name: raw_status
        tests:
          - not_null
      - name: clean_status
        tests:
          - not_null
          - accepted_values:
              values: ["delivered", "shipped", "processing", "cancelled"]
