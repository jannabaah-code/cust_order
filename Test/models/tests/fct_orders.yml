version: 2

models:
  - name: fct_orders
    columns:
      - name: order_id
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: order_amount
        tests:
          - not_null

      - name: order_currency
        tests:
          - not_null
          - accepted_values:
              values: ["USD"]

      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values: ["delivered", "shipped", "processing", "cancelled"]

      - name: order_date
        tests:
          - not_null
